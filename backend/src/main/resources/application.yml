spring:
  application:
    name: nutriai-api

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://127.0.0.1:5432/nutriai}
    username: ${SPRING_DATASOURCE_USERNAME:nutriai}
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

nutriai:
  version: 0.2.0
  jwt:
    secret: ${NUTRIAI_JWT_SECRET}
    access-token-expiration: 900000    # 15 minutes in ms
    refresh-token-expiration: 604800000 # 7 days in ms
    cookie:
      name: nutriai_refresh
      path: /api/v1/auth
      max-age: 604800   # 7 days in seconds
      http-only: true
      secure: false     # true in production
      same-site: Lax    # Lax for dev (cross-port), Strict for production

  llm:
    base-url: ${NUTRIAI_LLM_BASE_URL:https://api.ollama.com/v1}
    model: ${NUTRIAI_LLM_MODEL:glm4}
    api-key: ${NUTRIAI_LLM_API_KEY:}
    timeout-seconds: ${NUTRIAI_LLM_TIMEOUT:30}

  evolution:
    api-url: ${EVOLUTION_API_URL:http://localhost:8081}
    api-key: ${EVOLUTION_API_KEY:changeme}
    # Delay (ms) applied to outbound messages for rate-limit compliance (Phase 10 will tune this).
    # 0 = no delay. Recommended 2000-5000 in production to mimic human pacing.
    send-delay-ms: ${EVOLUTION_SEND_DELAY_MS:0}

  webhook:
    secret: ${NUTRIAI_WEBHOOK_SECRET:}