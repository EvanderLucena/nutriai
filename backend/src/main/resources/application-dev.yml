spring:
  datasource:
    url: jdbc:postgresql://127.0.0.1:5432/nutriai
    username: nutriai
    password: ${SPRING_DATASOURCE_PASSWORD:changeme}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    clean-disabled: false

logging:
  level:
    com.nutriai: DEBUG

nutriai:
  jwt:
    secret: ${NUTRIAI_JWT_SECRET:local-dev-secret-do-not-use-in-production}
    cookie:
      secure: false
      same-site: Lax
  seed:
    admin:
      email: admin@nutriai.com
      password: ${NUTRIAI_SEED_ADMIN_PASSWORD:Admin123!}
      name: Admin NutriAI